<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskBoard — Zadania</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body><nav class="navbar navbar-dark tb-navbar"><div class="container"><a href="boards.html" class="navbar-brand fw-bold">TaskBoard</a><span id="userName"></span><button id="logout" class="btn btn-outline-light btn-sm">Wyloguj</button></div></nav><main class="container py-4"><div class="d-flex justify-content-between align-items-center"><h1 class="h3" id="boardName">Zadania</h1><button id="newTask" class="btn btn-primary">Nowe zadanie</button></div><label for="priority" class="form-label mt-3">Priorytet</label><select id="priority" class="form-select mb-3" style="max-width:220px"><option value="">Wszystkie</option><option value="low">Niski</option><option value="medium">Średni</option><option value="high">Wysoki</option></select><div class="row g-2 align-items-end mb-3"><div class="col-12 col-md-4"><label for="filterAssignee" class="form-label">Przypisana osoba</label><select id="filterAssignee" class="form-select"><option value="">Wszystkie osoby</option></select></div><div class="col-12 col-md-5"><label for="filterQ" class="form-label">Szukaj po tytule</label><input id="filterQ" class="form-control" type="search" maxlength="100" placeholder="Wpisz fragment tytułu"></div><div class="col-12 col-md-3"><button id="clearFilters" class="btn btn-outline-secondary w-100" type="button">Wyczyść filtry</button></div></div><div id="message" role="alert" aria-live="polite"></div><div class="row g-3"><section class="col-12 col-lg-4"><div class="task-column column-todo h-100"><h2 class="h5 column-heading">Do zrobienia</h2><div id="col-todo" class="d-grid gap-2"></div></div></section><section class="col-12 col-lg-4"><div class="task-column column-in_progress h-100"><h2 class="h5 column-heading">W trakcie</h2><div id="col-in_progress" class="d-grid gap-2"></div></div></section><section class="col-12 col-lg-4"><div class="task-column column-done h-100"><h2 class="h5 column-heading">Gotowe</h2><div id="col-done" class="d-grid gap-2"></div></div></section></div></main><div class="modal fade" id="taskModal" tabindex="-1" aria-labelledby="taskModalTitle" aria-hidden="true"><div class="modal-dialog"><form id="taskForm" class="modal-content" novalidate><div class="modal-header"><h2 class="modal-title fs-5" id="taskModalTitle">Zadanie</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Zamknij"></button></div><div class="modal-body"><div id="taskError" class="alert alert-danger d-none" role="alert"></div><label for="title" class="form-label">Tytuł</label><input id="title" class="form-control" minlength="3" maxlength="100" required><div class="invalid-feedback">Tytuł musi mieć 3–100 znaków.</div><label for="description" class="form-label mt-2">Opis</label><textarea id="description" class="form-control"></textarea><label for="status" class="form-label mt-2">Status</label><select id="status" class="form-select"><option value="todo">Do zrobienia</option><option value="in_progress">W trakcie</option><option value="done">Gotowe</option></select><label for="taskPriority" class="form-label mt-2">Priorytet</label><select id="taskPriority" class="form-select"><option value="low">Niski</option><option value="medium" selected>Średni</option><option value="high">Wysoki</option></select><label for="assigneeId" class="form-label mt-2">Przypisana osoba</label><select id="assigneeId" class="form-select"><option value="">Nieprzypisane</option></select><label for="deadline" class="form-label mt-2">Termin</label><input id="deadline" type="date" class="form-control"></div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Anuluj</button><button id="saveTask" type="submit" class="btn btn-primary">Zapisz</button></div></form></div></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/api.js"></script>
<script src="js/board.js"></script></body></html>
