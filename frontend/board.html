<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskBoard — Zadania</title><link rel="stylesheet" href="css/style.css"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><nav class="navbar bg-white border-bottom"><div class="container"><a href="boards.html" class="navbar-brand">TaskBoard</a><span id="userName"></span><button id="logout" class="btn btn-outline-secondary btn-sm">Wyloguj</button></div></nav><main class="container py-4"><div class="d-flex justify-content-between align-items-center"><h1 class="h3" id="boardName">Zadania</h1><button id="newTask" class="btn btn-primary">Nowe zadanie</button></div><label for="priority" class="form-label mt-3">Priorytet</label><select id="priority" class="form-select mb-3" style="max-width:220px"><option value="">Wszystkie</option><option value="low">Niski</option><option value="medium">Średni</option><option value="high">Wysoki</option></select><div class="row g-2 align-items-end mb-3"><div class="col-12 col-md-4"><label for="filterAssignee" class="form-label">Przypisana osoba</label><select id="filterAssignee" class="form-select"><option value="">Wszystkie osoby</option></select></div><div class="col-12 col-md-5"><label for="filterQ" class="form-label">Szukaj po tytule</label><input id="filterQ" class="form-control" type="search" maxlength="100" placeholder="Wpisz fragment tytułu"></div><div class="col-12 col-md-3"><button id="clearFilters" class="btn btn-outline-secondary w-100" type="button">Wyczyść filtry</button></div></div><div id="message" role="alert" aria-live="polite"></div><div class="row g-3"><section class="col-12 col-lg-4"><h2 class="h5">Do zrobienia</h2><div id="col-todo" class="d-grid gap-2"></div></section><section class="col-12 col-lg-4"><h2 class="h5">W trakcie</h2><div id="col-in_progress" class="d-grid gap-2"></div></section><section class="col-12 col-lg-4"><h2 class="h5">Gotowe</h2><div id="col-done" class="d-grid gap-2"></div></section></div></main><div class="modal fade" id="taskModal" tabindex="-1" aria-labelledby="taskModalTitle" aria-hidden="true"><div class="modal-dialog"><form id="taskForm" class="modal-content"><div class="modal-header"><h2 class="modal-title fs-5" id="taskModalTitle">Zadanie</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Zamknij"></button></div><div class="modal-body"><div id="taskError" class="alert alert-danger d-none" role="alert"></div><label for="title" class="form-label">Tytuł</label><input id="title" class="form-control" minlength="3" maxlength="100" required><div class="invalid-feedback">Tytuł musi mieć 3–100 znaków.</div><label for="description" class="form-label mt-2">Opis</label><textarea id="description" class="form-control"></textarea><label for="status" class="form-label mt-2">Status</label><select id="status" class="form-select"><option value="todo">Do zrobienia</option><option value="in_progress">W trakcie</option><option value="done">Gotowe</option></select><label for="taskPriority" class="form-label mt-2">Priorytet</label><select id="taskPriority" class="form-select"><option value="low">Niski</option><option value="medium" selected>Średni</option><option value="high">Wysoki</option></select><label for="assigneeId" class="form-label mt-2">Przypisana osoba</label><select id="assigneeId" class="form-select"><option value="">Nieprzypisane</option></select><label for="deadline" class="form-label mt-2">Termin</label><input id="deadline" type="date" class="form-control"></div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Anuluj</button><button id="saveTask" type="submit" class="btn btn-primary">Zapisz</button></div></form></div></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script>
let users=[];const id=new URLSearchParams(location.search).get('id'),msg=document.querySelector('#message'),modal=new bootstrap.Modal('#taskModal');let editing=null;const labels={low:'Niski',medium:'Średni',high:'Wysoki'};function error(e){msg.className='alert alert-danger';msg.textContent=e.message;const box=document.querySelector('#taskError');if(document.querySelector('#taskModal').classList.contains('show')){box.textContent=e.message;box.classList.remove('d-none')}}async function api(url,method='GET',body){const r=await fetch('/api'+url,{method,credentials:'same-origin',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});if(r.status===401){location.href='login.html';throw Error('Zaloguj się')}const d=r.status===204?null:await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Błąd API');return d}
function button(label,fn,cls='btn-outline-primary'){const b=document.createElement('button');b.className='btn btn-sm '+cls;b.textContent=label;b.onclick=fn;return b}
async function load(){try{const params=new URLSearchParams();for(const [field,key] of [['priority','priority'],['filterAssignee','assigneeId'],['filterQ','q']]){const val=document.getElementById(field).value.trim();if(val)params.set(key,val)}const tasks=await api('/boards/'+encodeURIComponent(id)+'/tasks'+(params.size?'?'+params.toString():''));for(const s of ['todo','in_progress','done'])document.getElementById('col-'+s).replaceChildren();for(const t of tasks){const card=document.createElement('article');card.className='card shadow-sm';const body=document.createElement('div');body.className='card-body';const h=document.createElement('h3');h.className='h6';h.textContent=t.title;const info=document.createElement('p');info.className='small';info.textContent='Priorytet: '+(labels[t.priority]||t.priority)+(t.deadline?' · Termin: '+String(t.deadline).slice(0,10):'')+(t.assigneeId?' · Osoba #'+t.assigneeId:'');body.append(h,info,button('Szczegóły',()=>edit(t.id,true)), ' ',button('Edytuj',()=>edit(t.id)));body.append(' ',button('Zmień status',async()=>{try{const full=await api('/tasks/'+t.id);await api('/tasks/'+t.id,'PUT',{...full,status:{todo:'in_progress',in_progress:'done',done:'todo'}[t.status]});await load()}catch(e){error(e)}}));body.append(' ',button('Usuń',async()=>{if(!confirm('Usunąć zadanie?'))return;try{await api('/tasks/'+t.id,'DELETE');await load()}catch(e){error(e)}},'btn-outline-danger'));card.append(body);document.getElementById('col-'+t.status)?.append(card)}msg.textContent='';msg.className=''}catch(e){error(e)}}
async function edit(taskId,readOnly=false){try{editing=taskId;const t=await api('/tasks/'+taskId);for(const key of ['title','description','status','priority','deadline','assigneeId']){const field=document.getElementById(key==='priority'?'taskPriority':key);field.value=key==='deadline'?String(t[key]||'').slice(0,10):(t[key]||'')}document.querySelector('#taskModalTitle').textContent=readOnly?'Szczegóły zadania':'Edytuj zadanie';document.querySelector('#saveTask').hidden=readOnly;document.querySelector('#taskError').classList.add('d-none');for(const field of document.querySelectorAll('#taskForm input, #taskForm textarea, #taskForm select'))field.disabled=readOnly;modal.show()}catch(e){error(e)}}
document.querySelector('#newTask').onclick=()=>{editing=null;document.querySelector('#taskForm').reset();document.querySelector('#taskModalTitle').textContent='Nowe zadanie';document.querySelector('#saveTask').hidden=false;document.querySelector('#taskError').classList.add('d-none');for(const field of document.querySelectorAll('#taskForm input, #taskForm textarea, #taskForm select')){field.disabled=false;field.classList.remove('is-invalid')}modal.show()};document.querySelector('#priority').onchange=load;document.querySelector('#filterAssignee').onchange=load;let searchDelay;document.querySelector('#filterQ').oninput=()=>{clearTimeout(searchDelay);searchDelay=setTimeout(load,300)};document.querySelector('#clearFilters').onclick=()=>{document.querySelector('#priority').value='';document.querySelector('#filterAssignee').value='';document.querySelector('#filterQ').value='';clearTimeout(searchDelay);load()};document.querySelector('#taskForm').onsubmit=async e=>{e.preventDefault();const body={title:document.querySelector('#title').value.trim(),description:document.querySelector('#description').value,status:document.querySelector('#status').value,priority:document.querySelector('#taskPriority').value,deadline:document.querySelector('#deadline').value||null,assigneeId:document.querySelector('#assigneeId').value?Number(document.querySelector('#assigneeId').value):null,boardId:Number(id)};try{const field=document.querySelector('#title');field.classList.toggle('is-invalid',body.title.length<3||body.title.length>100);if(body.title.length<3||body.title.length>100)return;await api('/tasks'+(editing?'/'+editing:''),editing?'PUT':'POST',body);modal.hide();await load()}catch(e){error(e)}};document.querySelector('#logout').onclick=async()=>{await api('/auth/logout','POST');location.href='login.html'};(async()=>{if(!id){location.href='boards.html';return}try{const user=await api('/auth/me');document.querySelector('#userName').textContent=user.firstName+' '+user.lastName;users=await api('/users');const select=document.querySelector('#assigneeId');for(const u of users){const option=document.createElement('option');option.value=u.id;option.textContent=u.firstName+' '+u.lastName;select.append(option);const filterOption=option.cloneNode(true);document.querySelector('#filterAssignee').append(filterOption)}const board=await api('/boards/'+encodeURIComponent(id));document.querySelector('#boardName').textContent=board.name;await load()}catch(e){error(e)}})();
</script></body></html>
