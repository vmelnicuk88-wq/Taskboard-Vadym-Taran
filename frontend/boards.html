<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskBoard — Tablice</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body><nav class="navbar navbar-dark tb-navbar"><div class="container"><a href="boards.html" class="navbar-brand fw-bold">TaskBoard</a><div class="d-flex align-items-center gap-3"><span id="userName" class="text-white"></span><button id="logout" class="btn btn-outline-light btn-sm">Wyloguj</button></div></div></nav><main class="container py-4"><div class="d-flex justify-content-between align-items-center mb-4 gap-2"><h1 class="h3 mb-0">Moje tablice</h1><button id="add" class="btn btn-primary">Nowa tablica</button></div><div id="message" role="alert" aria-live="polite"></div><div id="boards" class="row g-3"></div></main>
<div class="modal fade" id="editor" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true"><div class="modal-dialog"><form id="boardForm" class="modal-content" novalidate><div class="modal-header"><h2 id="modalTitle" class="modal-title fs-5">Tablica</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Zamknij"></button></div><div class="modal-body"><div id="boardError" class="alert alert-danger d-none" role="alert"></div><label class="form-label" for="name">Nazwa</label><input id="name" class="form-control" maxlength="80" required><div class="invalid-feedback">Podaj nazwę (1–80 znaków).</div><label class="form-label mt-3" for="description">Opis</label><textarea id="description" class="form-control"></textarea></div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Anuluj</button><button class="btn btn-primary">Zapisz</button></div></form></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/api.js"></script>
<script src="js/boards.js"></script></body></html>
