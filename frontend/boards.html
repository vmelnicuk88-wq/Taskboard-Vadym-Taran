<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskBoard — Tablice</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><main class="container py-4"><div class="d-flex justify-content-between align-items-center mb-4"><h1 class="h3">Moje tablice</h1><button id="add" class="btn btn-primary">Nowa tablica</button></div><div id="message" role="alert" aria-live="polite"></div><div id="boards" class="row g-3"></div></main>
<div class="modal fade" id="editor" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true"><div class="modal-dialog"><form id="boardForm" class="modal-content"><div class="modal-header"><h2 id="modalTitle" class="modal-title fs-5">Tablica</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Zamknij"></button></div><div class="modal-body"><label class="form-label" for="name">Nazwa</label><input id="name" class="form-control" maxlength="80" required><label class="form-label mt-3" for="description">Opis</label><textarea id="description" class="form-control"></textarea></div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Anuluj</button><button class="btn btn-primary">Zapisz</button></div></form></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script>
const grid=document.querySelector('#boards'),message=document.querySelector('#message'),modal=new bootstrap.Modal('#editor');let editing=null,items=[];
function showError(text){message.className='alert alert-danger';message.textContent=text;}
async function request(path,options={}){const r=await fetch('/api/boards'+path,{credentials:'same-origin',...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});const data=r.status===204?null:await r.json().catch(()=>null);if(!r.ok)throw Error(data?.error||'Błąd API ('+r.status+')');return data;}
function render(){grid.replaceChildren();if(!items.length){const p=document.createElement('p');p.textContent='Brak tablic. Dodaj pierwszą!';grid.append(p);}items.forEach(board=>{const col=document.createElement('div');col.className='col-md-6 col-lg-4';const card=document.createElement('div');card.className='card h-100';const body=document.createElement('div');body.className='card-body';const title=document.createElement('h2');title.className='h5';title.textContent=board.name;const desc=document.createElement('p');desc.textContent=board.description||'';const edit=document.createElement('button');edit.className='btn btn-outline-primary btn-sm me-2';edit.textContent='Edytuj';edit.onclick=()=>openEditor(board);const del=document.createElement('button');del.className='btn btn-outline-danger btn-sm';del.textContent='Usuń';del.onclick=async()=>{if(!confirm('Usunąć tablicę „'+board.name+'”?'))return;try{await request('/'+encodeURIComponent(board.id),{method:'DELETE'});await load();}catch(e){showError(e.message);}};body.append(title,desc,edit,del);card.append(body);col.append(card);grid.append(col);});}
async function load(){try{const result=await request('');items=Array.isArray(result)?result:result?.boards||[];message.textContent='';message.className='';render();}catch(e){showError(e.message);}}
function openEditor(board=null){editing=board?.id??null;document.querySelector('#modalTitle').textContent=board?'Edytuj tablicę':'Nowa tablica';document.querySelector('#name').value=board?.name||'';document.querySelector('#description').value=board?.description||'';modal.show();}
document.querySelector('#add').onclick=()=>openEditor();
document.querySelector('#boardForm').addEventListener('submit',async e=>{e.preventDefault();const data={name:document.querySelector('#name').value.trim(),description:document.querySelector('#description').value.trim()};try{await request(editing===null?'':'/'+encodeURIComponent(editing),{method:editing===null?'POST':'PUT',body:JSON.stringify(data)});modal.hide();await load();}catch(err){showError(err.message);}});
load();
</script></body></html>
