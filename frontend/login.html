<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskBoard — Logowanie</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head>
<body class="login-page"><main class="container py-5" style="max-width:480px"><div class="card shadow-sm"><div class="card-body p-4"><h1 class="h3 mb-3">TaskBoard</h1><div class="btn-group w-100 mb-3"><button id="loginTab" class="btn btn-primary" type="button">Logowanie</button><button id="registerTab" class="btn btn-outline-primary" type="button">Rejestracja</button></div><form id="authForm" novalidate><div class="mb-3"><label for="login" class="form-label">Login</label><input id="login" class="form-control" minlength="3" maxlength="30" required autocomplete="username"><div class="invalid-feedback">Login musi mieć 3–30 znaków.</div></div><div id="names" hidden><div class="mb-3"><label for="firstName" class="form-label">Imię</label><input id="firstName" class="form-control" maxlength="80"><div class="invalid-feedback">Podaj imię.</div></div><div class="mb-3"><label for="lastName" class="form-label">Nazwisko</label><input id="lastName" class="form-control" maxlength="80"><div class="invalid-feedback">Podaj nazwisko.</div></div></div><div class="mb-3"><label for="password" class="form-label">Hasło</label><input id="password" type="password" class="form-control" minlength="8" required autocomplete="current-password"><div class="invalid-feedback">Hasło musi mieć co najmniej 8 znaków.</div></div><div id="message" role="alert" aria-live="polite"></div><button id="submit" class="btn btn-primary w-100" type="submit">Zaloguj się</button></form></div></div></main><script src="js/login.js"></script></body></html>
