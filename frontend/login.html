<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskBoard — Logowanie</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><main class="container py-5" style="max-width:480px"><div class="card shadow-sm"><div class="card-body p-4"><h1 class="h3 mb-3">TaskBoard</h1><div class="btn-group w-100 mb-3" role="group"><button id="loginTab" class="btn btn-primary" type="button">Logowanie</button><button id="registerTab" class="btn btn-outline-primary" type="button">Rejestracja</button></div><form id="authForm"><div class="mb-3"><label for="email" class="form-label">E-mail</label><input id="email" type="email" class="form-control" autocomplete="email" required></div><div class="mb-3"><label for="password" class="form-label">Hasło</label><input id="password" type="password" class="form-control" minlength="8" required></div><div id="message" role="alert" aria-live="polite"></div><button id="submit" class="btn btn-primary w-100" type="submit">Zaloguj się</button></form></div></div></main>
<script>
let mode='login';const form=document.querySelector('#authForm'),msg=document.querySelector('#message'),submit=document.querySelector('#submit');
function setMode(next){mode=next;msg.textContent='';submit.textContent=mode==='login'?'Zaloguj się':'Zarejestruj się';for(const [id,active] of [['loginTab',mode==='login'],['registerTab',mode==='register']])document.getElementById(id).className='btn '+(active?'btn-primary':'btn-outline-primary');}
document.querySelector('#loginTab').onclick=()=>setMode('login');document.querySelector('#registerTab').onclick=()=>setMode('register');
form.addEventListener('submit',async e=>{e.preventDefault();msg.className='';msg.textContent='';submit.disabled=true;try{const response=await fetch('/api/auth/'+mode,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({email:document.querySelector('#email').value.trim(),password:document.querySelector('#password').value})});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||'Błąd serwera ('+response.status+')');if(mode==='login'){location.href='boards.html';return;}msg.className='alert alert-success';msg.textContent='Konto utworzone. Możesz się zalogować.';setMode('login');msg.className='alert alert-success';msg.textContent='Konto utworzone. Możesz się zalogować.';}catch(err){msg.className='alert alert-danger';msg.textContent=err.message;}finally{submit.disabled=false;}});
</script></body></html>
